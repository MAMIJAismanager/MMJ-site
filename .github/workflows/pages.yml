name: Deploy MMJ Site to GitHub Pages
run-name: mmj-converge:${{ github.event.client_payload.convergenceKey }}

on:
  repository_dispatch:
    types:
      - mmj_public_converge

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  SOURCE_DATE_EPOCH: '1784378700'
  MMJ_BUILD_ID: mmj-github-pages-production-convergence
  MMJ_BUILD_ENVIRONMENT_CLASS: production
  MMJ_PUBLIC_RELEASE_REQUIRED: '1'
  MMJ_PUBLIC_CONVERGENCE_REQUIRED: '1'
  MMJ_PUBLIC_RELEASE_REVISION: ${{ github.event.client_payload.source.commitSha }}
  MMJ_PORTFOLIO_HANDOFF_ORIGIN: https://cms.mamajing.work
  MMJ_COMMISSION_GUIDE_HANDOFF_ORIGIN: https://cms.mamajing.work
  NUXT_APP_BASE_URL: /
  NUXT_PUBLIC_MMJ_MEDIA_BASE_URL: https://media.mamajing.work
  NUXT_PUBLIC_MMJ_CONTACT_FORM_ENDPOINT: https://formspree.io/f/mrpzbjbv
  MMJ_CANONICAL_PUBLIC_URL: https://mamajing.work

  MMJ_CMS_PUBLIC_CONVERGENCE_BUILD_RECEIPT_ENDPOINT: https://cms.mamajing.work/api/v1/internal/public-convergence-build-receipts
  MMJ_CMS_PUBLIC_CONVERGENCE_SUPERSESSION_RECEIPT_ENDPOINT: https://cms.mamajing.work/api/v1/internal/public-convergence-supersession-receipts

  MMJ_PUBLIC_CONVERGENCE_KEY: ${{ github.event.client_payload.convergenceKey }}
  MMJ_PUBLIC_CONVERGENCE_REVISION: ${{ github.event.client_payload.convergenceRevision }}
  MMJ_PUBLIC_CONVERGENCE_DIGEST: ${{ github.event.client_payload.convergenceDigest }}
  MMJ_PUBLIC_CONVERGENCE_ISSUED_AT: ${{ github.event.client_payload.issuedAt }}

  MMJ_PUBLIC_SOURCE_REPOSITORY: ${{ github.event.client_payload.source.repository }}
  MMJ_PUBLIC_SOURCE_REF: ${{ github.event.client_payload.source.ref }}
  MMJ_PUBLIC_SOURCE_COMMIT_SHA: ${{ github.event.client_payload.source.commitSha }}

  MMJ_PORTFOLIO_EVENT_ACTIVE: '0'
  MMJ_PORTFOLIO_ADOPTION_MODE: dispatch-generation
  MMJ_DISPATCH_SCHEMA_VERSION: '2'
  MMJ_DISPATCH_GENERATION_CONTRACT: ${{ github.event.client_payload.portfolio.generationContract }}
  MMJ_DISPATCH_GENERATION_DIGEST: ${{ github.event.client_payload.portfolio.generationDigest }}
  MMJ_DELIVERY_KEY: ${{ github.event.client_payload.portfolio.deliveryKey }}
  MMJ_COLLECTION_VERSION_ID: ${{ github.event.client_payload.portfolio.collectionVersionId }}
  MMJ_EXPECTED_SNAPSHOT_DIGEST: ${{ github.event.client_payload.portfolio.snapshotDigest }}
  MMJ_HANDOFF_RECEIPT_ID: ${{ github.event.client_payload.portfolio.handoffReceiptId }}
  MMJ_PROJECT_COUNT: ${{ github.event.client_payload.portfolio.projectCount }}
  MMJ_ASSET_COUNT: ${{ github.event.client_payload.portfolio.assetCount }}
  MMJ_SOURCE_WORKBOOK_REVISION: ${{ github.event.client_payload.portfolio.sourceWorkbookRevision }}
  MMJ_COLLECTION_HEAD_REVISION: ${{ github.event.client_payload.portfolio.collectionHeadRevision }}
  MMJ_ISSUED_AT: ${{ github.event.client_payload.portfolio.issuedAt }}

  MMJ_COMMISSION_GUIDE_ADOPTION_MODE: convergence-generation
  MMJ_COMMISSION_GUIDE_ID: ${{ github.event.client_payload.commission.guideId }}
  MMJ_COMMISSION_PUBLICATION_VERSION_ID: ${{ github.event.client_payload.commission.publicationVersionId }}
  MMJ_COMMISSION_EXPECTED_SNAPSHOT_DIGEST: ${{ github.event.client_payload.commission.snapshotDigest }}
  MMJ_COMMISSION_CONTENT_DIGEST: ${{ github.event.client_payload.commission.contentDigest }}
  MMJ_COMMISSION_HANDOFF_RECEIPT_ID: ${{ github.event.client_payload.commission.handoffReceiptId }}
  MMJ_COMMISSION_SOURCE_WORKBOOK_REVISION: ${{ github.event.client_payload.commission.sourceWorkbookRevision }}
  MMJ_COMMISSION_PUBLICATION_HEAD_REVISION: ${{ github.event.client_payload.commission.publicationHeadRevision }}
  MMJ_COMMISSION_ISSUED_AT: ${{ github.event.client_payload.commission.issuedAt }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact convergence source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.client_payload.source.commitSha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify immutable public convergence generation
        run: node scripts/mmj-ui29-public-convergence-input-verify.mjs preflight

      - name: Report public convergence build started
        id: convergence-started-receipt
        continue-on-error: true
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
        run: node scripts/mmj-ui29-public-convergence-receipt.mjs started

      - name: Warn if CMS convergence started receipt delivery is pending
        if: ${{ steps.convergence-started-receipt.outcome != 'success' }}
        run: echo "::warning::CMS public convergence started receipt was not acknowledged. Public build continues."

      - name: Verify MMJ-UI29-A source closure
        run: npm run verify:mmj-ui29-static

      - name: Run MMJ-UI29-A contract tests
        run: npm run test:mmj-ui29

      - name: Adopt exact sealed CMS public convergence content
        run: npm run sync:public-content

      - name: Seal public convergence provenance
        run: node scripts/mmj-ui29-public-convergence-provenance.mjs

      - name: Verify adopted public convergence generation
        run: node scripts/mmj-ui29-public-convergence-input-verify.mjs post-adopt

      - name: Run approved lifecycle scripts
        run: npm rebuild

      - name: Verify portfolio handoff
        run: npm run verify:portfolio-handoff

      - name: Verify commission guide handoff
        run: npm run verify:commission-guide-handoff

      - name: Verify aggregate public release
        run: npm run verify:public-release

      - name: Emit convergence-bound public deployment receipt
        run: node scripts/mmj-ui29-publish-release-receipt.mjs

      - name: Generate static site without a second network fetch
        run: npm run generate:local

      - name: Verify generated static artifact
        run: npm run verify:static-output

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .output/public

  deployment-admission:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.convergence-admission.outputs.deploy }}
      state: ${{ steps.convergence-admission.outputs.state }}
      relation: ${{ steps.convergence-admission.outputs.relation }}
      reason: ${{ steps.convergence-admission.outputs.reason }}
      observed_current_convergence_key: ${{ steps.convergence-admission.outputs.observed_current_convergence_key }}
      observed_current_convergence_digest: ${{ steps.convergence-admission.outputs.observed_current_convergence_digest }}
      observed_current_convergence_revision: ${{ steps.convergence-admission.outputs.observed_current_convergence_revision }}
    steps:
      - name: Checkout exact convergence authority tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.client_payload.source.commitSha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node for deployment admission
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'

      - name: Resolve current public convergence Pages write authority
        id: convergence-admission
        run: node scripts/mmj-ui29-public-convergence-deployment-admission.mjs

  deploy:
    needs:
      - build
      - deployment-admission
    if: ${{ needs.build.result == 'success' && needs.deployment-admission.outputs.deploy == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      convergence_deployed: ${{ steps.deployment.outcome == 'success' && 'true' || 'false' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  convergence-success-receipt:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.convergence_deployed == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact convergence receipt tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.client_payload.source.commitSha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node for success receipt
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Report public convergence deployment committed
        continue-on-error: true
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
          MMJ_DEPLOYMENT_ID: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          MMJ_DEPLOYMENT_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/mmj-ui29-public-convergence-receipt.mjs succeeded

  convergence-supersession-receipt:
    needs:
      - build
      - deployment-admission
    if: ${{ always() && needs.build.result == 'success' && needs.deployment-admission.result == 'success' && needs.deployment-admission.outputs.state == 'withheld' && needs.deployment-admission.outputs.relation == 'historical' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact convergence supersession tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.client_payload.source.commitSha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node for supersession receipt
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Report public convergence deployment withheld
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
          MMJ_CONVERGENCE_OBSERVED_CURRENT_KEY: ${{ needs.deployment-admission.outputs.observed_current_convergence_key }}
          MMJ_CONVERGENCE_OBSERVED_CURRENT_DIGEST: ${{ needs.deployment-admission.outputs.observed_current_convergence_digest }}
          MMJ_CONVERGENCE_OBSERVED_CURRENT_REVISION: ${{ needs.deployment-admission.outputs.observed_current_convergence_revision }}
        run: node scripts/mmj-ui29-public-convergence-supersession-receipt.mjs

  convergence-failure-receipt:
    needs:
      - build
      - deployment-admission
      - deploy
    if: ${{ always() && (needs.build.result == 'failure' || (needs.deployment-admission.outputs.deploy == 'true' && needs.deploy.result == 'failure')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact convergence failure receipt tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.client_payload.source.commitSha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node for failure receipt
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Report public convergence build or deployment failed
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
          MMJ_BUILD_ERROR_CODE: E_PUBLIC_CONVERGENCE_BUILD_FAILED
          MMJ_BUILD_ERROR_MESSAGE: MMJ public convergence build or admitted deployment failed.
          MMJ_BUILD_ERROR_PHASE: github-pages-convergence-build-or-deploy
        run: node scripts/mmj-ui29-public-convergence-receipt.mjs failed
