name: Deploy MMJ Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - mmj_portfolio_promoted
      - mmj-public-commission-guide-published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  queue: max

env:
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  SOURCE_DATE_EPOCH: '1784378700'
  MMJ_BUILD_ID: mmj-github-pages-production
  MMJ_BUILD_ENVIRONMENT_CLASS: production
  MMJ_PORTFOLIO_HANDOFF_ORIGIN: https://cms.mamajing.work
  MMJ_COMMISSION_GUIDE_HANDOFF_ORIGIN: https://cms.mamajing.work
  NUXT_APP_BASE_URL: /
  NUXT_PUBLIC_MMJ_MEDIA_BASE_URL: https://media.mamajing.work
  NUXT_PUBLIC_MMJ_CONTACT_FORM_ENDPOINT: https://formspree.io/f/mrpzbjbv
  MMJ_CANONICAL_PUBLIC_URL: https://mamajing.work
  MMJ_CMS_BUILD_RECEIPT_ENDPOINT: https://cms.mamajing.work/api/v1/internal/portfolio-build-receipts

  MMJ_DELIVERY_KEY: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && github.event.client_payload.deliveryKey || '' }}
  MMJ_COLLECTION_VERSION_ID: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && github.event.client_payload.collectionVersionId || '' }}
  MMJ_EXPECTED_SNAPSHOT_DIGEST: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && github.event.client_payload.snapshotDigest || '' }}
  MMJ_HANDOFF_RECEIPT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && github.event.client_payload.handoffReceiptId || '' }}
  MMJ_PROJECT_COUNT: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && format('{0}', github.event.client_payload.projectCount) || '' }}
  MMJ_ASSET_COUNT: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && format('{0}', github.event.client_payload.assetCount) || '' }}
  MMJ_SOURCE_WORKBOOK_REVISION: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && format('{0}', github.event.client_payload.sourceWorkbookRevision) || '' }}
  MMJ_COLLECTION_HEAD_REVISION: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && format('{0}', github.event.client_payload.collectionHeadRevision) || '' }}
  MMJ_ISSUED_AT: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && github.event.client_payload.issuedAt || '' }}

  MMJ_COMMISSION_SCHEMA_VERSION: '1'
  MMJ_COMMISSION_CONTENT_KIND: commission-guide
  MMJ_COMMISSION_DELIVERY_KEY: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && github.event.client_payload.deliveryKey || '' }}
  MMJ_COMMISSION_GUIDE_ID: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && github.event.client_payload.guideId || 'default' }}
  MMJ_COMMISSION_PUBLICATION_VERSION_ID: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && github.event.client_payload.publicationVersionId || '' }}
  MMJ_COMMISSION_EXPECTED_SNAPSHOT_DIGEST: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && github.event.client_payload.snapshotDigest || '' }}
  MMJ_COMMISSION_HANDOFF_RECEIPT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && github.event.client_payload.handoffReceiptId || '' }}
  MMJ_COMMISSION_SOURCE_WORKBOOK_REVISION: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && format('{0}', github.event.client_payload.sourceWorkbookRevision) || '' }}
  MMJ_COMMISSION_PUBLICATION_HEAD_REVISION: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && format('{0}', github.event.client_payload.publicationHeadRevision) || '' }}
  MMJ_COMMISSION_ISSUED_AT: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' && github.event.client_payload.issuedAt || '' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify MMJ-UI29-A source closure
        run: npm run verify:mmj-ui29-static

      - name: Run MMJ-UI29-A contract tests
        run: npm run test:mmj-ui29

      - name: Verify portfolio dispatch against current CMS head
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        run: node scripts/mmj-ui29-dispatch-input-verify.mjs preflight

      - name: Verify commission dispatch against current CMS head
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' }}
        run: node scripts/mmj-ui29-commission-dispatch-input-verify.mjs preflight

      - name: Report portfolio build started
        id: portfolio-started-receipt
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        continue-on-error: true
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
        run: node scripts/mmj-ui29-build-receipt.mjs started

      - name: Warn if CMS started receipt delivery is pending
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && steps.portfolio-started-receipt.outcome != 'success' }}
        run: echo "::warning::CMS started receipt callback did not complete. Public build continues."

      - name: Adopt sealed CMS public content
        run: npm run sync:public-content

      - name: Verify adopted portfolio dispatch identity
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        run: node scripts/mmj-ui29-dispatch-input-verify.mjs post-adopt

      - name: Verify adopted commission dispatch identity
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj-public-commission-guide-published' }}
        run: node scripts/mmj-ui29-commission-dispatch-input-verify.mjs post-adopt

      - name: Run approved lifecycle scripts
        run: npm rebuild

      - name: Verify portfolio handoff
        run: npm run verify:portfolio-handoff

      - name: Verify commission guide handoff
        run: npm run verify:commission-guide-handoff

      - name: Verify aggregate public release
        run: npm run verify:public-release

      - name: Emit portfolio public deployment receipt
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        run: node scripts/mmj-ui29-publish-release-receipt.mjs

      - name: Generate static site without a second network fetch
        run: npm run generate:local

      - name: Verify generated static artifact
        run: npm run verify:static-output

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Checkout portfolio receipt script after deployment commit
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node for portfolio success receipt
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'

      - name: Report portfolio deployment committed
        id: portfolio-success-receipt
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' }}
        continue-on-error: true
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
          MMJ_DEPLOYMENT_ID: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          MMJ_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/mmj-ui29-build-receipt.mjs succeeded

      - name: Warn if CMS success receipt delivery is pending
        if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && steps.portfolio-success-receipt.outcome != 'success' }}
        run: echo "::warning::GitHub Pages deployment committed, but CMS success receipt delivery did not complete. Public deployment remains successful."

  portfolio-observe:
    needs: deploy
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout propagation observer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node for propagation observation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'

      - name: Observe canonical deployment propagation
        run: node scripts/mmj-ui29-public-deployment-probe.mjs --observe

  portfolio-failure-receipt:
    needs:
      - build
      - deploy
    if: ${{ always() && github.event_name == 'repository_dispatch' && github.event.action == 'mmj_portfolio_promoted' && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout failure receipt script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node for failure receipt
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'

      - name: Report portfolio build or deployment failed
        env:
          MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET: ${{ secrets.MMJ_PORTFOLIO_BUILD_RECEIPT_SECRET }}
          MMJ_GITHUB_EVENT_ACTION: ${{ github.event.action }}
          MMJ_BUILD_JOB_RESULT: ${{ needs.build.result }}
          MMJ_DEPLOY_JOB_RESULT: ${{ needs.deploy.result }}
          MMJ_BUILD_ERROR_CODE: E_PUBLIC_BUILD_FAILED
          MMJ_BUILD_ERROR_MESSAGE: MMJ GitHub Pages build or deployment failed.
          MMJ_BUILD_ERROR_PHASE: github-pages-build-or-deploy
        run: node scripts/mmj-ui29-failure-receipt.mjs
